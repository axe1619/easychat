############################################################
# HTTP -> HTTPS
############################################################
server {
  listen 80;
  server_name easycontact.top www.easycontact.top dcontact.cloud;

  # ACME challenges
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  return 301 https://$host$request_uri;
}

############################################################
# Helpers
############################################################
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

############################################################
# HTTPS: easycontact.top + www.easycontact.top
############################################################
server {
  listen 443 ssl http2;
  server_name easycontact.top www.easycontact.top;

  ssl_certificate     /etc/letsencrypt/live/easycontact.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/easycontact.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # App Server de Chatwoot
  set $upstream 127.0.0.1:3000;

  underscores_in_headers on;

  # ACME challenges
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  # WebSocket ActionCable
  location /cable {
    proxy_pass http://$upstream/cable;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  # Resto de la app
  location / {
    proxy_pass_header Authorization;
    proxy_pass http://$upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_buffering off;

    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

############################################################
# HTTPS: dcontact.cloud
############################################################
server {
  listen 443 ssl http2;
  server_name dcontact.cloud;

  ssl_certificate     /etc/letsencrypt/live/dcontact.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dcontact.cloud/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # App Server de Chatwoot
  set $upstream 127.0.0.1:3000;

  underscores_in_headers on;

  # ACME challenges
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  # Redirigir raíz a login
  location = / {
    return 302 /app/login;
  }

  # WebSocket ActionCable
  location /cable {
    proxy_pass http://$upstream/cable;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  # Resto
  location / {
    proxy_pass_header Authorization;
    proxy_pass http://$upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_buffering off;

    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

############################################################
# PUERTO 3035 con TLS: easycontact.top
############################################################
server {
  listen 3035 ssl;
  server_name easycontact.top;

  ssl_certificate     /etc/letsencrypt/live/easycontact.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/easycontact.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3036;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}

