############################################################
# HTTPS: dcontact.cloud
############################################################
server { 
  listen 443 ssl http2;
  server_name dcontact.cloud;

  # Certificados de dcontact.cloud
  ssl_certificate     /etc/letsencrypt/live/dcontact.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dcontact.cloud/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # App Server de Chatwoot
  set $upstream 127.0.0.1:3000;

  # Chatwoot usa headers con underscore
  underscores_in_headers on;

  # Retos ACME por HTTPS (opcional)
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  # Exact path: coincide solo la raiz
  location = / {
    return 302 /app/login;
  }

  # Prefix path: coincide todas las rutas que empiezan con /
  location / {
    proxy_pass_header Authorization;
    proxy_pass http://$upstream;

    # WebSocket / Upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Cabeceras
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on; # opcional
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

############################################################
# PUERTO 3035 con TLS: easycontact.top
############################################################
server {
  listen 3035 ssl;
  server_name easycontact.top;

  ssl_certificate     /etc/letsencrypt/live/easycontact.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/easycontact.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3036;  # Backend correspondiente
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }
}

