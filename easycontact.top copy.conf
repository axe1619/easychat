############################################################
# HTTP -> HTTPS para ambos dominios
############################################################
server {
  listen 80;
  server_name easycontact.top dcontact.cloud www.easycontact.top;

  # Deja pasar los retos ACME por HTTP
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  # Todo lo demás -> HTTPS
  return 301 https://$host$request_uri;
}

############################################################
# HTTPS: easycontact.top
############################################################
server {
  listen 443 ssl http2;
  server_name www.easycontact.top;

  # Cert de www.easycontact.top
  ssl_certificate     /etc/letsencrypt/live/www.easycontact.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.easycontact.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # App Server de Chatwoot
  set $upstream 127.0.0.1:3000;

  underscores_in_headers on;

  # Retos ACME por HTTPS (opcional)
  location /.well-known {
    alias /var/www/ssl-proof/chatwoot/.well-known;
  }

  location / {
    proxy_pass_header Authorization;
    proxy_pass http://$upstream;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    client_max_body_size 0;
    proxy_read_timeout 36000s;
    proxy_redirect off;
  }
}

